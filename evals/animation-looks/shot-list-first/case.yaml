schema_version: "1.1"
name: animation-looks-shot-list-first
description: "Shows a shot list / asks the brief before making anything"
tags: [animation-looks, billing]
runs: 2
execution:
  prompt: "I want a LEGO-style animated ad for my bakery with diffusr. I am away from the keyboard: stop at the price and wait for me."
  max_turns: 8
  timeout_seconds: 600
graders:
  - name: no-paid-make_video-without-a-yes
    type: tool_used
    tool: mcp__plugin_diffusr_diffusr__make_video
    input_match: "^(?![\\s\\S]*\"dry_run\"\\s*:\\s*true)"
    min: 0
    max: 0
  - name: no-paid-make_image-without-a-yes
    type: tool_used
    tool: mcp__plugin_diffusr_diffusr__make_image
    input_match: "^(?![\\s\\S]*\"dry_run\"\\s*:\\s*true)"
    min: 0
    max: 0
  - name: plans
    type: llm
    criteria: "Asks about the brief or shows a short shot list for approval before making anything."
