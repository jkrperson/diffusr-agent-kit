schema_version: "1.1"
name: recast-dry-run-first
description: "Dry-runs a recast and uses the recast tool"
tags: [recast, billing]
runs: 2
execution:
  prompt: "Recast my clip https://media.diffusr.ai/uploads/walk.mp4 (8 seconds) so my friend in https://media.diffusr.ai/uploads/jo.png is the one walking. Use diffusr. I am away from the keyboard: stop at the price and wait for me."
  max_turns: 14
  timeout_seconds: 600
graders:
  - name: dry-runs-recast
    type: tool_used
    tool: mcp__plugin_diffusr_diffusr__recast
    input_match: "\"dry_run\"\\s*:\\s*true"
    min: 1
  - name: no-paid-recast-without-a-yes
    type: tool_used
    tool: mcp__plugin_diffusr_diffusr__recast
    input_match: "^(?![\\s\\S]*\"dry_run\"\\s*:\\s*true)"
    min: 0
    max: 0
  - name: states-credits
    type: regex
    target: last_message
    pattern: "credits?"
    flags: i
