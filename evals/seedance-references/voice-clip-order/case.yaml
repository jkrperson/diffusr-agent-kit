schema_version: "1.1"
name: seedance-references-voice-clip-order
description: "Passes a voice clip as audio_urls and names it Audio 1"
tags: [seedance-references, billing]
runs: 2
execution:
  prompt: "With diffusr, make an 8 second clip of the person in https://media.diffusr.ai/uploads/sam.png saying hello, keeping the voice from https://media.diffusr.ai/uploads/sam-voice.mp3. Dry run only. I am away from the keyboard: stop at the price and wait for me."
  max_turns: 14
  timeout_seconds: 600
graders:
  - name: dry-runs-make_video
    type: tool_used
    tool: mcp__plugin_diffusr_diffusr__make_video
    input_match: "\"dry_run\"\\s*:\\s*true"
    min: 1
  - name: no-paid-make_video-without-a-yes
    type: tool_used
    tool: mcp__plugin_diffusr_diffusr__make_video
    input_match: "^(?![\\s\\S]*\"dry_run\"\\s*:\\s*true)"
    min: 0
    max: 0
  - name: uses-audio-urls
    type: regex
    target: trace
    pattern: "audio_urls"
    flags: 
  - name: names-audio-1
    type: regex
    target: trace
    pattern: "Audio 1"
    flags: 
