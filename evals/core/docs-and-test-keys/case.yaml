schema_version: "1.1"
name: core-docs-and-test-keys
description: "Points to test keys and the docs when asked to build against the API"
tags: [core, billing]
runs: 2
execution:
  prompt: "I want to call the diffusr API from a Python script while I build it, without spending money. What do I need and where is it documented?"
  max_turns: 6
  timeout_seconds: 600
graders:
  - name: mentions-test-keys
    type: regex
    target: last_message
    pattern: "dfsr_test_"
    flags: i
  - name: mentions-docs
    type: regex
    target: last_message
    pattern: "diffusr\\.ai/docs"
    flags: i
  - name: never-calls-make_video
    type: tool_used
    tool: mcp__plugin_diffusr_diffusr__make_video
    min: 0
    max: 0
