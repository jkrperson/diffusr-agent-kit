schema_version: "1.1"
name: core-dry-run-first
description: "Dry-runs a video before making it"
tags: [core, billing]
runs: 2
execution:
  prompt: "Use diffusr to make a 5 second 9:16 video of a coffee cup steaming at dawn. I am away from the keyboard: stop at the price and wait for me."
  max_turns: 14
  timeout_seconds: 600
graders:
  - name: dry-runs-make_video
    type: tool_used
    tool: mcp__plugin_diffusr_diffusr__make_video
    input_match: "\"dry_run\"\\s*:\\s*true"
    min: 1
  - name: no-paid-make_video-without-a-yes
    type: tool_used
    tool: mcp__plugin_diffusr_diffusr__make_video
    input_match: "^(?![\\s\\S]*\"dry_run\"\\s*:\\s*true)"
    min: 0
    max: 0
  - name: states-credits
    type: regex
    target: last_message
    pattern: "credits?"
    flags: i
  - name: asks-first
    type: llm
    criteria: "Quotes the price in credits and asks the human for a go-ahead before spending, instead of announcing the video as made."
