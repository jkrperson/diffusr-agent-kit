schema_version: "1.1"
name: core-picks-the-right-tool
description: "Picks make_image for a picture, not video"
tags: [core, billing]
runs: 2
execution:
  prompt: "Make me one product-style image of a ceramic mug on a wooden table with diffusr. Check the price first. I am away from the keyboard: stop at the price and wait for me."
  max_turns: 14
  timeout_seconds: 600
graders:
  - name: dry-runs-make_image
    type: tool_used
    tool: mcp__plugin_diffusr_diffusr__make_image
    input_match: "\"dry_run\"\\s*:\\s*true"
    min: 1
  - name: no-paid-make_image-without-a-yes
    type: tool_used
    tool: mcp__plugin_diffusr_diffusr__make_image
    input_match: "^(?![\\s\\S]*\"dry_run\"\\s*:\\s*true)"
    min: 0
    max: 0
  - name: never-calls-make_video
    type: tool_used
    tool: mcp__plugin_diffusr_diffusr__make_video
    min: 0
    max: 0
  - name: states-credits
    type: regex
    target: last_message
    pattern: "credits?"
    flags: i
