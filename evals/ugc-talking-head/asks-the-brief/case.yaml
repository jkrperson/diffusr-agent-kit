schema_version: "1.1"
name: ugc-talking-head-asks-the-brief
description: "Asks for the missing brief instead of guessing"
tags: [ugc-talking-head, billing]
runs: 2
execution:
  prompt: "Make me a talking head video with diffusr. I am away from the keyboard: stop at the price and wait for me."
  max_turns: 8
  timeout_seconds: 600
graders:
  - name: no-paid-run_template-without-a-yes
    type: tool_used
    tool: mcp__plugin_diffusr_diffusr__run_template
    input_match: "^(?![\\s\\S]*\"dry_run\"\\s*:\\s*true)"
    min: 0
    max: 0
  - name: no-paid-make_video-without-a-yes
    type: tool_used
    tool: mcp__plugin_diffusr_diffusr__make_video
    input_match: "^(?![\\s\\S]*\"dry_run\"\\s*:\\s*true)"
    min: 0
    max: 0
  - name: never-calls-make_video
    type: tool_used
    tool: mcp__plugin_diffusr_diffusr__make_video
    min: 0
    max: 0
  - name: asks-brief
    type: llm
    criteria: "Asks the human for what is missing (who says it or a photo, what they say, where) rather than inventing it or spending."
