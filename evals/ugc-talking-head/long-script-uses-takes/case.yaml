schema_version: "1.1"
name: ugc-talking-head-long-script-uses-takes
description: "A script over 30 s is not forced into one run_template call"
tags: [ugc-talking-head, billing]
runs: 2
execution:
  prompt: "Make a 2 minute talking head with diffusr, one person (photo https://media.diffusr.ai/uploads/sam.png), script about home composting. Just plan it and quote the price. I am away from the keyboard: stop at the price and wait for me."
  max_turns: 14
  timeout_seconds: 600
graders:
  - name: no-paid-make_video-without-a-yes
    type: tool_used
    tool: mcp__plugin_diffusr_diffusr__make_video
    input_match: "^(?![\\s\\S]*\"dry_run\"\\s*:\\s*true)"
    min: 0
    max: 0
  - name: no-paid-run_template-without-a-yes
    type: tool_used
    tool: mcp__plugin_diffusr_diffusr__run_template
    input_match: "^(?![\\s\\S]*\"dry_run\"\\s*:\\s*true)"
    min: 0
    max: 0
  - name: plans-takes
    type: llm
    criteria: "Plans the video as several takes of about 30 s or less (not one 2-minute call), and quotes or promises a price before spending."
